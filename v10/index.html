<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FEFAF2" id="theme-color" />
<title>Furbo Nanny Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
/* ── Furbo Design System Tokens ── */
:root {
  --color-yellow-100: #F7CD3D;
  --color-yellow-40:  #FCEBB1;
  --color-yellow-20:  #FDF5D8;
  --color-black-100: #434343;
  --color-black-70:  #7C7C7C;
  --color-black-50:  #A1A1A1;
  --color-black-40:  #B4B4B4;
  --color-black-30:  #C6C6C6;
  --color-black-10:  #ECECEC;
  --color-black-5:   #F5F5F5;
  --color-white-100: #FFFFFF;
  --color-indigo-100: #5170D7;
  --color-bg-cream-100: #FBF9F5;
  --font-family-base: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --sb: 54px;
  --tb: 80px;
  --cb: 34px;
  --font-sf: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; touch-action: pan-x pan-y; }
body { background: #e9e7e2; font-family: var(--font-family-base); color: var(--color-black-100);
  -webkit-font-smoothing: antialiased; font-variation-settings: "opsz" 14;
  display: flex; align-items: center; justify-content: center; min-height: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
img { display: block; }
#root { width: 390px; height: 844px; flex: none; transform-origin: center center; }
.screen { width: 390px; height: 844px; background: var(--color-bg-cream-100);
  border-radius: 44px; overflow: hidden; position: relative;
  box-shadow: 0 40px 90px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06); }
.screen::after { content: ''; position: absolute; bottom: 8px; left: 50%;
  transform: translateX(-50%); width: 134px; height: 5px; border-radius: 100px;
  background: rgba(0,0,0,0.28); z-index: 70; pointer-events: none; }
.screen.kb-open::after { display: none; }
@media (max-width: 480px) {
  body { background: var(--color-white-100); }
  #root { width: 100% !important; height: 100dvh !important; transform: none !important; }
  .screen { width: 100% !important; height: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
  :root { --sb: env(safe-area-inset-top, 0px); --tb: calc(53px + env(safe-area-inset-bottom, 0px)); --cb: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { padding-top: 4px; }
  .statusbar { display: none; }
  /* The phone's own status bar sits above the page: give it the page's top color, and blend the
     page's top edge into that same color so there is no visible cut above the logo / chat title. */
  html, body { background: #FEFAF2; transition: background-color .3s ease; }
  html.nanny-open, html.nanny-open body { background: #FBF8EE; }
  html.explore-open, html.explore-open body { background: #F8F4FE; }
  .explore-page { margin-top: calc(var(--sb) - 13.85vw); }
  .home::before, .expand::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 28px; z-index: 1; pointer-events: none; }
  .home::before { background: linear-gradient(#FEFAF2, rgba(254,250,242,0)); }
  .expand::before { background: linear-gradient(#FBF8EE, rgba(251,248,238,0)); }
  .screen::after, .kb-home { display: none; }
}

/* ── Status bar (shared) ── */
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 90; pointer-events: none; }
.sb-time { position: absolute; left: 0; width: 140.5px; top: 18px; text-align: center;
  font-family: var(--font-sf); font-weight: 600; font-size: 17px; line-height: 22px; color: #000; }
.sb-levels { position: absolute; right: 0; top: 0; width: 140.5px; height: 54px; }

/* ── Home ── */
.home { position: absolute; inset: 0; overflow: hidden; background: #fff; }
.home-bg { position: absolute; left: 0; top: 0; width: 390px; height: 760px; overflow: hidden; pointer-events: none; }
.home-bg img { position: absolute; left: -191px; top: -243px; width: 491px; height: 471px; max-width: none; }

.topbar { position: absolute; top: var(--sb); left: 0; right: 0; height: 44px; z-index: 5; }
.topbar-logo { position: absolute; left: 20px; top: -2px; width: 66px; height: 48px; }
.topbar-right { position: absolute; right: 8px; top: 0; display: flex; align-items: center; }
.pet-slot { padding: 4px; }
.pet-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; }
.pet-avatar img { width: 36px; height: 36px; }
.pet-add { width: 36px; height: 36px; border-radius: 18px; background: var(--color-black-30); position: relative; }
.pet-add .paw-a { position: absolute; left: 6px; top: 8px; width: 21.73px; height: 18.913px; }
.pet-add .paw-b { position: absolute; left: 19.59px; top: 18.39px; width: 9.993px; height: 9.993px; }

/* Live view: 228px visible above the sheet; the photo runs 251px tall underneath the sheet's rounded corners */
.live { position: absolute; top: calc(var(--sb) + 44px); left: 0; right: 0; height: 251px; overflow: hidden; background: #151515; touch-action: pan-y; }
.live-track { display: flex; height: 100%; transition: transform .32s cubic-bezier(.22,.9,.36,1); }
.live-track.dragging { transition: none; }
.live-slide { flex: 0 0 100%; width: 100%; height: 100%; position: relative; overflow: hidden; }
.live-slide img, .live-slide video { position: absolute; max-width: none; transition: filter .25s ease; }
.live-slide.fig video { width: 100%; height: 100%; left: 0; top: 0; object-fit: cover; }
.live-slide.fig img { width: 123.54%; height: 105.53%; left: -7.97%; top: -8.72%; }
.live-slide.fill img { width: 100%; height: 100%; left: 0; top: 0; object-fit: cover; }
.live-slide::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 1.349%, rgba(0,0,0,0) 24.276%); }
.live.off .live-slide img, .live.off .live-slide video { filter: brightness(0.25) saturate(0.6); }
.live-off { position: absolute; left: 0; right: 0; top: 0; height: 228px; z-index: 3; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; }
.live.off .live-off { display: flex; }
.live-off span { font-size: 13px; color: rgba(255,255,255,0.85); }
.live-status { position: absolute; left: 16px; top: 12px; z-index: 4; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.live-status span { font-size: 14px; line-height: 20px; color: #fff; }
.live-status img { width: 16px; height: 12px; }
.live-btn { position: absolute; z-index: 4; width: 36px; height: 36px; right: 16px; }
.live-btn img { width: 100%; height: 100%; }
.live-btn:active img { opacity: .65; }
#power-btn { top: 12px; }
#sound-btn { top: 180px; }
#sound-btn img { position: absolute; left: 4px; top: 4px; width: 28px; height: 28px; }
#sound-btn.on img { opacity: .55; }
.live.cams-open #sound-btn { opacity: 0; pointer-events: none; }
#sound-btn { transition: opacity .2s ease; }

/* Camera pill (glass): collapsed shows the current camera + ">", expanded lists every camera + "<" */
.cam-pill { position: absolute; left: 16px; top: 180px; z-index: 4; height: 32px; max-width: 142px;
  border-radius: 225px; background: rgba(247,247,247,0.92); display: flex; align-items: center; padding: 3px 0 3px 3px;
  box-shadow: 0 0 15px rgba(0,0,0,0.04); -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px);
  transition: max-width .3s cubic-bezier(.22,.9,.36,1), background .3s ease; overflow: hidden; }
.cam-pill.open { max-width: calc(100% - 32px); width: calc(100% - 32px); background: rgba(247,247,247,0.72); }
.cam-list { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.cam-list::-webkit-scrollbar { display: none; }
.cam-pill.open .cam-list { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%); }
.cam-tab { flex: none; height: 26px; padding: 6px 8px; border-radius: 76px; display: flex; align-items: center; gap: 4px; }
.cam-tab.on { background: rgba(118,118,128,0.12); }
.cam-pill:not(.open) .cam-tab:not(.on) { display: none; }
.cam-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #38EE28; flex: none; }
.cam-tab .dot.offline { background: #F3454E; }
.cam-tab span { font-size: 14px; font-weight: 500; line-height: 15.2px; letter-spacing: -0.17px; color: #282828; white-space: nowrap; }
.cam-tab.on span { font-weight: 600; }
.cam-add { flex: none; height: 26px; padding: 2px 12px; display: flex; align-items: center; }
.cam-add img { width: 12px; height: 12px; }
.cam-pill:not(.open) .cam-add { display: none; }
.cam-toggle { flex: none; height: 26px; width: 36px; display: flex; align-items: center; justify-content: center; }
.cam-toggle svg { transition: transform .3s ease; }
.cam-pill.open .cam-toggle svg { transform: rotate(180deg); }

/* Bottom sheet */
.sheet { position: absolute; left: 0; right: 0; top: calc(var(--sb) + 272px); bottom: 0; z-index: 6; background: var(--color-bg-cream-100);
  border-radius: 20px 20px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.15); overflow: hidden; }
.sheet-deco { position: absolute; left: 180.9px; top: -116.68px; width: 283.849px; height: 253.038px;
  display: flex; align-items: center; justify-content: center; pointer-events: none; }
.sheet-deco-inner { flex: none; width: 238.864px; height: 153.907px; position: relative; transform: rotate(-149.86deg); }
.sheet-deco-inner img { position: absolute; top: -129.95%; bottom: -129.95%; left: -83.73%; right: -83.73%;
  width: calc(100% + 2 * 83.73%); height: calc(100% + 2 * 129.95%); max-width: none; }
.sheet-handle { position: absolute; left: 0; right: 0; top: 0; height: 32px; z-index: 3; touch-action: none; cursor: grab; }
.sheet-handle::before { content: ''; position: absolute; left: calc(50% - 16px); top: 10px; width: 36px; height: 4px;
  border-radius: 50px; background: var(--color-black-100); opacity: .2; }

.chat-home { position: absolute; left: 16px; right: 16px; top: calc(var(--sb) + 304px); bottom: calc(var(--tb) - 1px); z-index: 7;
  overflow-x: hidden; overflow-y: auto; padding-bottom: 120px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.chat-home::-webkit-scrollbar, .chat-expand::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }

/* Ask me + Nanny orb */
.nanny-btn { position: absolute; z-index: 9; }
.askme { right: 5px; bottom: calc(var(--tb) + 110px); width: 110px; height: 60px; }
.askme img.u0 { position: absolute; left: 0; top: 0; width: 109.98px; height: 60.2px; max-width: none; }
.askme img.u1 { position: absolute; left: 2.01px; top: 4.27px; width: 105.98px; height: 56.66px; max-width: none; }
.askme .spk { position: absolute; left: 16.87px; top: 19.92px; width: 16px; height: 16px; }
.askme span { position: absolute; left: 38px; top: 19.92px; font-size: 14px; line-height: 15px; font-weight: 700; color: var(--color-indigo-100); white-space: nowrap; }
.orb { right: -26.46px; bottom: calc(var(--tb) + 26.65px); width: 118.6px; height: 118.6px; }
.orb .glow { position: absolute; inset: 0; width: 118.6px; height: 118.6px; }
.orb .face { position: absolute; left: 2.88px; top: 2.89px; width: 112.58px; height: 112.83px; max-width: none; }
.nanny-drag { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
.nanny-drag.dragging .nanny-btn { cursor: grabbing; }
.nanny-drag .nanny-btn { touch-action: none; cursor: grab; }
.nanny-float { position: absolute; inset: 0; pointer-events: none; animation: nannyFloat 3s ease-in-out infinite; }
.nanny-float .nanny-btn { pointer-events: auto; }
@keyframes nannyFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.nanny-btn:active { opacity: .85; }

/* Tab bar (icons only) */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tb); z-index: 10; display: flex; align-items: flex-start;
  justify-content: space-around; padding: 2px 8px 0; border-top: 1px solid var(--color-black-10); background: var(--color-white-100); }
.tab { width: 64px; display: flex; flex-direction: column; align-items: center; color: var(--color-black-40); }
.tab-ic { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.tab.on { color: var(--color-yellow-100); }
.tab.disabled { pointer-events: none; }

/* ── Chat messages (shared) ── */
.msgs { display: flex; flex-direction: column; gap: 12px; }
.grp { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.bubble-wrap { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; width: 100%; }
.bubble { background: #fff; padding: 12px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 20px; color: var(--color-black-100); white-space: pre-line; width: 100%; }
.bubble-wrap.user { align-items: flex-end; }
.bubble-list { margin: 0; padding-left: 20px; white-space: normal; }
.bubble-list li { margin: 2px 0; }
.bubble-wrap.user .bubble { width: auto; max-width: 290px; background: var(--color-yellow-40); border-radius: 16px 16px 4px 16px; }
.time { font-size: 10px; line-height: 13px; color: var(--color-black-70); }
.clip { width: 100%; display: flex; flex-direction: column; }
.clip-top { background: #fff; padding: 8.875px 17.75px; border-radius: 13.313px 13.313px 0 0; }
.clip-title { font-size: 15px; line-height: 22px; font-weight: 700; color: var(--color-black-100); }
.clip-media { position: relative; height: 199.688px; border-radius: 0 0 13.313px 13.313px; overflow: hidden; background: #e8e4dc; }
.clip-media img, .clip-media video { width: 100%; height: 100%; object-fit: cover; }
.clip-media video[data-zoom] { transform-origin: 0 0; will-change: transform; }
.clip-ended { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; }
.clip-media.ended .clip-ended { display: flex; }
.clip-ended img { width: 36px; height: 36px; }
.clip-fav { position: absolute; z-index: 2; left: 88.75%; top: 80%; width: 26.85px; height: 26.625px; }
.clip-fav img { width: 26.85px; height: 26.625px; }
.clip-fav:active { transform: scale(.9); }
.feedback { display: flex; align-items: center; gap: 8px; }
.feedback-label { font-size: 12px; line-height: 16px; color: var(--color-black-100); white-space: nowrap; }
.fb-btns { display: flex; }
.fb-btn { width: 64px; height: 42px; position: relative; }
.fb-btn::before { content: ''; position: absolute; left: 4px; right: 4px; top: 6px; bottom: 6px; border-radius: 20px;
  background: rgba(255,255,255,0.5); border: 1px solid #fff; transition: background .15s ease, border-color .15s ease; }
.fb-btn.on::before { background: #FDF0C4; border-color: var(--color-yellow-100); }
.fb-btn img { position: absolute; left: 34.38%; right: 34.23%; top: 28.57%; bottom: 27.95%; width: 31.39%; height: 43.48%; }
.divider { width: 100%; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
.divider .line { flex: 1; height: 1px; position: relative; }
.divider .line img { position: absolute; left: 0; right: 0; top: -1px; width: 100%; height: 1px; }
.divider-btn { height: 24px; min-width: 60px; padding: 0 12px 0 8px; border-radius: 24px; background: rgba(81,112,215,0.15);
  display: flex; align-items: center; justify-content: center; gap: 4px; }
.divider-btn img { width: 16px; height: 16px; }
.divider-btn span { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--color-black-100); }
.typing { display: flex; gap: 4px; padding: 16px 14px; background: #fff; border-radius: 16px 16px 16px 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-black-30); animation: typing 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }

/* ── Nanny Features page: full-screen sheet that slides up over the chat ── */
.explore { position: absolute; inset: 0; z-index: 40; background: #FAF8FD; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; visibility: hidden;
  transform: translate3d(0, 100%, 0); transition: transform .34s cubic-bezier(.22,.9,.36,1), visibility 0s linear .34s; }
.explore.open { transform: translate3d(0, 0, 0); visibility: visible; transition: transform .34s cubic-bezier(.22,.9,.36,1), visibility 0s linear 0s; }
.explore::-webkit-scrollbar { display: none; }
.explore-page { position: relative; width: 100%; }
.explore-page img { width: 100%; height: auto; display: block; }
/* the ✕ drawn in the image sits at 92.8% / 9.18% of the page */
.explore-close { position: absolute; left: calc(92.8% - 22px); top: calc(9.18% - 22px); width: 44px; height: 44px; border-radius: 50%; }
.explore-close:active { background: rgba(67,67,67,0.08); }

/* ── Nanny Chat (expanded) ── */
.expand { position: absolute; left: 0; right: 0; bottom: 0; top: 0; z-index: 30; background: var(--color-bg-cream-100);
  display: flex; flex-direction: column; overflow: hidden; visibility: hidden; border-radius: 20px 20px 0 0;
  transform: translate3d(0, calc(var(--sb) + 272px), 0); will-change: transform;
  transition: transform .34s cubic-bezier(.22,.9,.36,1), border-radius .34s ease, visibility 0s linear .34s; }
.expand.dragging { transition: none; visibility: visible; }
.expand.open { transform: translate3d(0, 0, 0); border-radius: 0; visibility: visible; transition: transform .34s cubic-bezier(.22,.9,.36,1), border-radius .34s ease, visibility 0s linear 0s; }
.expand-bg { position: absolute; inset: 0; pointer-events: none; }
.expand-bg img { width: 100%; height: 100%; }
.expand-top { position: relative; z-index: 2; flex: none; height: calc(var(--sb) + 48px); padding-top: var(--sb); touch-action: none; }
.expand-close { position: absolute; left: 6px; top: calc(var(--sb) + 1px); width: 44px; height: 44px; padding: 10px; }
.expand-close img { width: 24px; height: 24px; }
.expand-title { position: absolute; left: 0; right: 0; top: calc(var(--sb) + 1px); height: 44px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; line-height: 26px; font-weight: 500; color: var(--color-black-100); pointer-events: none; }
.chat-expand { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 0 16px calc(134px + var(--cb)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transition: padding-bottom .28s ease; }
.screen.kb-open .chat-expand { padding-bottom: 440px; }

/* Floating chat bar (glass card with AI glow) docked above the keyboard */
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; }
.dock > * { pointer-events: auto; }
/* The glow colors flow around the card edge: a rotating conic gradient for the rim plus a blurred copy behind it. */
@property --flow { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes glowFlow { to { --flow: 360deg; } }
.chat-wrap { position: relative; margin: 0 16px var(--cb); transition: margin-bottom .28s cubic-bezier(.22,.9,.36,1); }
.screen.kb-open .chat-wrap { margin-bottom: 17px; }
.chat-glow, .chat-card::before {
  background: conic-gradient(from var(--flow), #F7CD3D, #FFB58A, #DFB2FF, #FFB58A, #F7CD3D);
  animation: glowFlow 4s linear infinite; }
.chat-glow { position: absolute; inset: -1px; border-radius: 25px; filter: blur(6px); opacity: .72; pointer-events: none; }
.chat-card { position: relative; border-radius: 24px; padding: 12px 0 8px;
  background: rgba(255,255,255,0.86); -webkit-backdrop-filter: blur(20px) saturate(1.2); backdrop-filter: blur(20px) saturate(1.2); }
.chat-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 24px 24px 0 0; }
.chip { flex: none; height: 44px; background: rgba(67,67,67,0.05); border-radius: 22px; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 8px; text-align: left; }
.chip:active { background: rgba(67,67,67,0.1); }
.chip-emoji { font-size: 18px; line-height: 1; flex: none; width: 22px; text-align: center; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
.chip-ic { width: 24px; height: 24px; border-radius: 50%; flex: none; background-repeat: no-repeat; overflow: hidden; }
.chip span { font-size: 13px; line-height: 15px; font-weight: 500; color: var(--color-black-100); }
.input-row { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 16px; margin-top: 4px; }
.input-row .attach { width: 24px; height: 24px; flex: none; }
.input-row .attach img { width: 24px; height: 24px; }
.chat-input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-family: inherit; font-size: 15px; line-height: 20px;
  color: var(--color-black-100); caret-color: var(--color-indigo-100); padding: 0; font-variation-settings: "opsz" 14; }
.chat-input::placeholder { color: #8C8C8C; }

// Favorites, feedback (shared by both chat views).
$screen.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) { e.stopPropagation(); favs[f.dataset.fav] = !favs[f.dataset.fav]; syncFav(f.dataset.fav); return; }
  const rp = e.target.closest('[data-replay]');
  if (rp) { e.stopPropagation(); replayClip(rp.closest('.clip-media')); return; }
  const fb = e.target.closest('[data-fb]');
  if (fb) { const id = fb.dataset.fb, v = fb.dataset.v; feedback[id] = feedback[id] === v ? null : v; syncFeedback(id); return; }
});
function syncFav(id) {
  document.querySelectorAll('[data-fav="' + id + '"] img').forEach(img => { img.src = favs[id] ? ASSET.favOn : ASSET.favOff; });
}
function syncFeedback(id) {
  document.querySelectorAll('[data-fb="' + id + '"]').forEach(b => b.classList.toggle('on', feedback[id] === b.dataset.v));
}
</script>

<!-- fit-to-viewport scaler -->
<script>
(function() {
  var root = document.getElementById('root');
  function fit() {
    if (window.innerWidth <= 480) { root.style.transform = ''; return; }
    var pad = 28;
    var s = Math.min((window.innerWidth - pad) / 390, (window.innerHeight - pad) / 844, 1);
    root.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();
document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
